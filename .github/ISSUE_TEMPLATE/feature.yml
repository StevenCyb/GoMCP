name: Feature request
description: Suggest an addition
labels: [enhancement]
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What do you want to build that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could it look, for example the annotation or API you would write
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: MCP specification reference
      description: Link to the part of the 2026-07-28 specification, if the request is about the protocol
