name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test -race -timeout 5m ./...

  build:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="gomcp-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          BIN="gomcp"
          [ "${{ matrix.goos }}" = "windows" ] && BIN="gomcp.exe"
          mkdir "$NAME"
          go build -ldflags "-s -w -X main.linkVersion=${GITHUB_REF_NAME}" -o "$NAME/$BIN" ./cmd/gomcp
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd "$NAME" && zip -r "../${NAME}.zip" .)
          else
            tar -czf "${NAME}.tar.gz" "$NAME"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: gomcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            gomcp-*.tar.gz
            gomcp-*.zip

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum gomcp-* > checksums.txt)
          # tags with a suffix (v0.1.0-rc1, v1.0.0-beta.2) are published as pre-releases
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $PRE \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
