name: Test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch: # run the smoke test of a branch by hand: Actions > Test > Run workflow

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      # the runner tests build and run generated servers, so they need a few minutes
      - run: go test -race -timeout 5m ./...

      # example is its own module; it must keep compiling against the runtime
      - run: go vet ./...
        working-directory: example

  # Windows is a release target. This job is informative and not a required check:
  # it shows early when a change breaks the build or the tests there.
  test-windows:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go test -timeout 5m ./...

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --path-mode=abs

  # After a merge to main: install and run exactly what a user would get from this commit,
  # so a broken module or CLI shows up before a tag is cut.
  smoke:
    needs: [test, test-windows, lint]
    # on every push, so a feature branch is checked before it is merged (the pull request itself has no fetchable merge commit)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest] # the release targets
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GOPRIVATE: github.com/StevenCyb/GoMCP # fetch the commit directly, the proxy and checksum database lag
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # only needed while the repository is private, harmless afterwards
      - run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - run: scripts/smoke.sh "$GITHUB_SHA"
