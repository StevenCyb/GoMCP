name: Test

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      # the runner tests build and run generated servers, so they need a few minutes
      - run: go test -race -timeout 5m ./...

      # example is its own module; it must keep compiling against the runtime
      - run: go vet ./...
        working-directory: example

  # Windows is a release target. This job is informative and not a required check:
  # it shows early when a change breaks the build or the tests there.
  test-windows:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go test -timeout 5m ./...

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --path-mode=abs

  # After a merge to main: install and run exactly what a user would get from this commit,
  # so a broken module or CLI shows up before a tag is cut.
  smoke:
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      GOPRIVATE: github.com/StevenCyb/GoMCP # fetch the commit directly, the proxy and checksum database lag
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # only needed while the repository is private, harmless afterwards
      - run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - run: scripts/smoke.sh "$GITHUB_SHA"
