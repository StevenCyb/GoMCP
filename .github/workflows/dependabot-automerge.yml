name: Dependabot auto-merge

# Patch and minor updates from Dependabot merge themselves once the required checks (test, lint) are green.
# Major updates stay open for a manual review. Needs "Allow auto-merge" and a branch protection rule with
# required checks on main, otherwise auto-merge would not wait for the pipeline.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'StevenCyb/GoMCP'
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
